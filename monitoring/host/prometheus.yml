# Variante « réseau host » (GitHub Codespaces : le réseau entre conteneurs y est bloqué).
# Prometheus partage le réseau du Codespace et lit l'API publiée sur localhost:8000.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: ticketsort-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]
