# C13 - Livraison continue du modèle :
#   tests -> préparation + entraînement/évaluation -> barrière qualité -> rapport -> packaging Docker -> publication
name: MLOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      min_f1:
        description: "Seuil F1 macro minimal pour livrer"
        default: "0.80"

env:
  MIN_F1: ${{ github.event.inputs.min_f1 || '0.80' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tests données, modèle, API, app, dérive
        run: pytest -v --cov=src --cov=api --cov=app --cov=monitoring --cov-report=term --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  train-evaluate:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Préparation des données
        run: python -m src.data.prepare
      - name: Entraînement et évaluation
        run: python -m src.model.train
      - name: Benchmark des candidats locaux
        run: python -m src.benchmark.run_benchmark
      - name: Barrière qualité (bloque la livraison sous le seuil)
        run: python -m src.model.quality_gate --min-f1 "$MIN_F1"
      - name: Résumé dans l'onglet du run
        if: always()
        run: |
          echo "## Métriques du modèle" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## Benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat reports/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-report
          path: |
            reports/
            models/

  package-deliver:
    needs: train-evaluate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image (entraîne le modèle dans l'image)
        run: docker build -t "ticketsort-api:${GITHUB_SHA::7}" .
      - name: Test de fumée de l'image
        run: |
          docker run -d --name smoke -e API_KEYS=smoke -p 8000:8000 "ticketsort-api:${GITHUB_SHA::7}"
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H "X-API-Key: smoke" -H "Content-Type: application/json" \
               -d '{"texte":"le wifi coupe sans arrêt"}'
          docker rm -f smoke
      - name: Export de l'image versionnée
        run: docker save "ticketsort-api:${GITHUB_SHA::7}" | gzip > "ticketsort-api-${GITHUB_SHA::7}.tar.gz"
      - name: Livraison de l'image comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: ticketsort-api-image
          path: ticketsort-api-*.tar.gz
          retention-days: 30
      - name: Résumé de la livraison
        run: |
          echo "## Image livrée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ticketsort-api:${GITHUB_SHA::7}\` construite, testée (health + predict) et livrée en artefact." >> "$GITHUB_STEP_SUMMARY"
          echo "Déploiement : \`docker load < ticketsort-api-${GITHUB_SHA::7}.tar.gz\` puis \`docker run -e API_KEYS=... -p 8000:8000 ticketsort-api:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
